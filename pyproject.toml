[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "senran"
version = "0.1.0"
description = "森蚺 (Senran) — 以文言驅策萬象 Python 函式庫之優雅代理模組"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "sucryan" }
]
keywords = ["senran", "wenyan", "classical-chinese", "metaprogramming", "proxy", "fun", "dsl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: Chinese (Traditional)",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/sucryan/senran"
Repository = "https://github.com/sucryan/senran"

[tool.setuptools]
packages = ["senran", "senran.scrolls"]

[project.scripts]
senran = "senran.transcriber:main"
